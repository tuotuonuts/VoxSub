name: Intel NPU hardware probe

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      model_path:
        description: Absolute path to a local GGUF model on the Intel NPU PC. Leave empty to search VoxSub's model directory.
        required: false
        type: string
      llama_dir:
        description: Absolute path to the folder containing the packaged OpenVINO llama-server.exe. Leave empty to use the installed VoxSub runtime.
        required: false
        type: string

permissions:
  contents: read

jobs:
  probe:
    # Manual only: a public repository must never run pull-request code on a personal PC.
    runs-on: [self-hosted, windows, x64, intel-npu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1

      - name: Prepare NPU probe assets
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          New-Item -ItemType Directory -Path (Join-Path $PWD '.npu-probe') -Force | Out-Null
          Start-Transcript -LiteralPath (Join-Path $PWD '.npu-probe\prepare.log') -Force | Out-Null
          try {
          $assetRoot = Join-Path $PWD '.npu-assets'
          $probeRoot = Join-Path $PWD '.npu-probe'
          $runtimeRoot = Join-Path $assetRoot 'openvino'
          $modelRoot = Join-Path $assetRoot 'models'
          New-Item -ItemType Directory -Path $runtimeRoot, $modelRoot, $probeRoot -Force | Out-Null

          $runtimeZip = Join-Path $assetRoot 'llama-b10470-openvino.zip'
          $runtimeUrl = 'https://github.com/ggml-org/llama.cpp/releases/download/b10470/llama-b10470-bin-win-openvino-2026.2.1-x64.zip'
          $existingServer = Get-ChildItem -LiteralPath $runtimeRoot -Filter 'llama-server.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $existingServer) {
            $validZip = $false
            if (Test-Path -LiteralPath $runtimeZip) {
              try { [System.IO.Compression.ZipFile]::OpenRead($runtimeZip).Dispose(); $validZip = $true } catch { $validZip = $false }
            }
            for ($attempt = 1; $attempt -le 5 -and -not $validZip; $attempt++) {
              Remove-Item -LiteralPath $runtimeZip -Force -ErrorAction SilentlyContinue
              try {
                Invoke-WebRequest -Uri $runtimeUrl -OutFile $runtimeZip -UseBasicParsing -TimeoutSec 180
                [System.IO.Compression.ZipFile]::OpenRead($runtimeZip).Dispose()
                $validZip = $true
              } catch {
                Add-Content -LiteralPath (Join-Path $probeRoot 'prepare.log') -Value "Runtime download attempt $attempt failed: $($_.Exception.Message)"
                Start-Sleep -Seconds ([Math]::Min(30, $attempt * 5))
              }
            }
            if (-not $validZip) { throw "llama OpenVINO runtime archive could not be downloaded after 5 attempts." }
            Expand-Archive -LiteralPath $runtimeZip -DestinationPath $runtimeRoot -Force
          } else {
            Add-Content -LiteralPath (Join-Path $probeRoot 'probe.log') -Value "Reusing extracted runtime: $($existingServer.FullName)"
          }
          $name = [Text.Encoding]::ASCII.GetBytes('NPU_COMPILER_DYNAMIC_QUANTIZATION')
          $yes = [Text.Encoding]::ASCII.GetBytes('YES')
          $patched = $false
          $binaryCandidates = Get-ChildItem -LiteralPath $runtimeRoot -File -Recurse |
            Where-Object { $_.Extension -in @('.dll', '.exe') }
          foreach ($binary in $binaryCandidates) {
            $bytes = [System.IO.File]::ReadAllBytes($binary.FullName)
            for ($i = 0; $i -le $bytes.Length - $name.Length; $i++) {
              $matchesName = $true
              for ($n = 0; $n -lt $name.Length; $n++) { if ($bytes[$i + $n] -ne $name[$n]) { $matchesName = $false; break } }
              if (-not $matchesName) { continue }
              Add-Content -LiteralPath (Join-Path $probeRoot 'probe.log') -Value "Found option string in $($binary.Name) at byte offset $i."
              $scanEnd = [Math]::Min($bytes.Length - 4, $i + $name.Length + 4096)
              for ($j = $i + $name.Length; $j -le $scanEnd; $j++) {
                if ($bytes[$j] -eq $yes[0] -and $bytes[$j + 1] -eq $yes[1] -and $bytes[$j + 2] -eq $yes[2] -and $bytes[$j + 3] -eq 0) {
                  $bytes[$j] = [byte][char]'N'; $bytes[$j + 1] = [byte][char]'O'; $bytes[$j + 2] = 0
                  [System.IO.File]::WriteAllBytes($binary.FullName, $bytes)
                  $patched = $true
                  Add-Content -LiteralPath (Join-Path $probeRoot 'probe.log') -Value "Patched $($binary.Name) at byte offset $j (YES -> NO)."
                  break
                }
              }
              if ($patched) { break }
            }
            if ($patched) { break }
          }
          if (-not $patched) { throw 'Could not locate NPU_COMPILER_DYNAMIC_QUANTIZATION=YES in runtime binaries.' }

          $model = Join-Path $modelRoot 'Hy-MT2-1.8B-Q4_K_M.gguf'
          $modelUrl = 'https://modelscope.cn/models/Tencent-Hunyuan/Hy-MT2-1.8B-GGUF/resolve/master/Hy-MT2-1.8B-Q4_K_M.gguf'
          if (-not (Test-Path -LiteralPath $model)) {
            Invoke-WebRequest -Uri $modelUrl -OutFile $model -UseBasicParsing
          }
          $actualSha = (Get-FileHash -LiteralPath $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -ne 'dc5f44fcf1fa496ee7ad725982c0c8c553a4de00259b53af84c4b89fb0c06699') {
            throw "Model SHA256 mismatch: $actualSha"
          }
          } catch {
            Write-Error $_
            throw
          } finally {
            Stop-Transcript | Out-Null
          }

      - name: Verify Intel NPU execution
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          VOXSUB_NPU_TEST_MODEL: ${{ inputs.model_path }}
          VOXSUB_LLAMA_DIR: ${{ inputs.llama_dir }}
        run: ./scripts/npu_probe.ps1

      - name: Print probe summary
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $logs = @('.npu-probe\prepare.log', '.npu-probe\build.log', '.npu-probe\probe.log') | Where-Object { Test-Path -LiteralPath $_ }
          if ($logs.Count -gt 0) {
            $summary = (($logs | ForEach-Object { Get-Content -LiteralPath $_ -Raw }) -join "`n").Trim()
            $logs | ForEach-Object { Get-Content -LiteralPath $_ }
            $annotation = $summary.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error file=.npu-probe/build.log,line=1,title=NPU probe summary::$annotation"
          } else {
            Write-Output 'No NPU probe or build log was created.'
          }

      - name: Upload probe diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: intel-npu-probe
          path: .npu-probe
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
