name: Intel NPU hardware probe

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Model Hub entry to validate. Use all for the complete matrix.
        required: false
        default: all
        type: choice
        options:
          - all
          - mt-hy-mt2-1.8b-q4
          - mt-hy-mt2-1.8b-q6
          - mt-hy-mt2-1.8b-q8
          - mt-hy-mt2-7b-q4
          - mt-hy-mt2-7b-q6
          - mt-hy-mt2-7b-q8
      llama_dir:
        description: Absolute path to the folder containing the packaged OpenVINO llama-server.exe. Leave empty to use the installed VoxSub runtime.
        required: false
        type: string
      runtime_variant:
        description: OpenVINO runtime flavor to verify on the Intel NPU computer.
        required: false
        default: official
        type: choice
        options:
          - patched
          - official

permissions:
  contents: read

concurrency:
  group: intel-npu-hardware-probe
  cancel-in-progress: true

jobs:
  build-runtime:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore NPU-compatible runtime cache
        uses: actions/cache@v4
        with:
          path: .npu-assets/patched-openvino-no-npuw-b10470
          key: npu-runtime-b10470-openvino-2026.2.1-no-npuw-v4

      - name: Build NPU-compatible OpenVINO llama runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $assetRoot = Join-Path $PWD '.npu-assets'
          $probeRoot = Join-Path $PWD '.npu-probe'
          $srcRoot = Join-Path $assetRoot 'llama-src-b10470'
          $ovRoot = Join-Path $assetRoot 'openvino-toolkit-2026.2.1'
          $buildRoot = Join-Path $assetRoot 'llama-build-no-npuw-b10470'
          $patchedDir = Join-Path $assetRoot 'patched-openvino-no-npuw-b10470'
          New-Item -ItemType Directory -Path $assetRoot, $probeRoot -Force | Out-Null
          Start-Transcript -LiteralPath (Join-Path $probeRoot 'build.log') -Force | Out-Null
          try {
            if ((Test-Path -LiteralPath (Join-Path $patchedDir 'llama-server.exe') -PathType Leaf) -and
                (Test-Path -LiteralPath (Join-Path $patchedDir 'ggml-openvino.dll') -PathType Leaf)) {
              Write-Output "Reusing cached NPU-compatible runtime: $patchedDir"
            } else {
              git clone --depth 1 --branch b10470 https://github.com/ggml-org/llama.cpp.git $srcRoot
              if ($LASTEXITCODE -ne 0) { throw "llama.cpp clone failed (exit $LASTEXITCODE)." }

              $extra = Join-Path $srcRoot 'ggml\src\ggml-openvino\ggml-openvino-extra.cpp'
              $source = Get-Content -LiteralPath $extra -Raw
              $configPattern = New-Object Text.RegularExpressions.Regex(
                '(?s)\s*if \(device_name == "NPU"\) \{.*?\}\s*else if \(cache_dir && strlen\(cache_dir\) > 0\) \{\s*compile_config\.insert\(ov::cache_dir\(cache_dir\)\);\s*compile_config\.insert\(ov::cache_mode\(ov::CacheMode::OPTIMIZE_SIZE\)\);\s*\}'
              )
              $patchedSource = $configPattern.Replace(
                $source,
                "`r`n    if (cache_dir && strlen(cache_dir) > 0) {`r`n        compile_config.insert(ov::cache_dir(cache_dir));`r`n        compile_config.insert(ov::cache_mode(ov::CacheMode::OPTIMIZE_SIZE));`r`n    }",
                1
              )
              if ($patchedSource -eq $source) { throw 'Could not remove the private NPUW compile configuration.' }
              if ($patchedSource -match 'NPU_COMPILER_DYNAMIC_QUANTIZATION|NPU_USE_NPUW|NPUW_[A-Z_]+') {
                throw 'A private NPUW compile option remains after patching.'
              }
              Set-Content -LiteralPath $extra -Value $patchedSource -Encoding utf8

              $ovZip = Join-Path $assetRoot 'openvino-toolkit-windows-2026.2.1.zip'
              $ovUrl = 'https://storage.openvinotoolkit.org/repositories/openvino/packages/2026.2.1/windows/openvino_toolkit_windows_2026.2.1.21919.ede283a88e3_x86_64.zip'
              curl.exe --ipv4 --fail --location --retry 5 --retry-delay 5 --connect-timeout 20 --max-time 1800 --output $ovZip $ovUrl
              if ($LASTEXITCODE -ne 0) { throw "OpenVINO SDK download failed (exit $LASTEXITCODE)." }
              if ((Get-Item -LiteralPath $ovZip).Length -lt 190MB) { throw 'OpenVINO SDK archive is too small.' }
              [System.IO.Compression.ZipFile]::OpenRead($ovZip).Dispose()
              Expand-Archive -LiteralPath $ovZip -DestinationPath $ovRoot -Force
              $ovConfig = Get-ChildItem -LiteralPath $ovRoot -Filter 'OpenVINOConfig.cmake' -File -Recurse |
                Select-Object -First 1
              if (-not $ovConfig) { throw 'OpenVINOConfig.cmake was not found after SDK extraction.' }
              $ovCmakeDir = Split-Path -Parent $ovConfig.FullName
              $ovPackageRoot = Split-Path -Parent (Split-Path -Parent $ovCmakeDir)

              $vcpkgRoot = Join-Path $assetRoot 'vcpkg'
              git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkgRoot
              if ($LASTEXITCODE -ne 0) { throw "vcpkg clone failed (exit $LASTEXITCODE)." }
              & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
              if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed (exit $LASTEXITCODE)." }
              & (Join-Path $vcpkgRoot 'vcpkg.exe') install opencl --triplet x64-windows --disable-metrics
              if ($LASTEXITCODE -ne 0) { throw "vcpkg OpenCL install failed (exit $LASTEXITCODE)." }

              cmake -S $srcRoot -B $buildRoot `
                -DGGML_OPENVINO=ON `
                -DLLAMA_CURL=OFF `
                -DLLAMA_OPENSSL=OFF `
                -DOpenVINO_DIR="$ovCmakeDir" `
                -DCMAKE_TOOLCHAIN_FILE="$vcpkgRoot\scripts\buildsystems\vcpkg.cmake"
              if ($LASTEXITCODE -ne 0) { throw "llama.cpp CMake configure failed (exit $LASTEXITCODE)." }
              cmake --build $buildRoot --config Release --target llama-server --parallel 4
              if ($LASTEXITCODE -ne 0) { throw "llama.cpp build failed (exit $LASTEXITCODE)." }

              $runtimeDir = Join-Path $buildRoot 'bin\Release'
              if (-not (Test-Path -LiteralPath (Join-Path $runtimeDir 'llama-server.exe') -PathType Leaf)) {
                throw 'NPU-compatible llama-server.exe was not built.'
              }
              New-Item -ItemType Directory -Path $patchedDir -Force | Out-Null
              Copy-Item -Path (Join-Path $runtimeDir '*') -Destination $patchedDir -Recurse -Force
              $ovRuntimeBin = Join-Path $ovPackageRoot 'runtime\bin\intel64\Release'
              Copy-Item -Path (Join-Path $ovRuntimeBin '*') -Destination $patchedDir -Recurse -Force
              $openClDll = Join-Path $vcpkgRoot 'installed\x64-windows\bin\OpenCL.dll'
              if (Test-Path -LiteralPath $openClDll -PathType Leaf) {
                Copy-Item -LiteralPath $openClDll -Destination $patchedDir -Force
              }
              Write-Output "Built NPU-compatible runtime: $patchedDir"
            }

            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $vsInstall = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Redist.14.Latest -property installationPath |
              Select-Object -First 1)
            if (-not $vsInstall) { throw 'Visual C++ redistributable directory could not be located.' }
            $vcRuntimeDll = Get-ChildItem -LiteralPath (Join-Path $vsInstall 'VC\Redist\MSVC') `
              -Filter 'vcruntime140.dll' -File -Recurse |
              Where-Object {
                $_.FullName -match '(?i)\\x64\\Microsoft\.VC[^\\]*\.CRT\\vcruntime140\.dll$' -and
                $_.FullName -notmatch '(?i)\\onecore\\'
              } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $vcRuntimeDll) { throw 'The x64 Visual C++ runtime DLL directory was not found.' }
            $vcCrtDir = $vcRuntimeDll.Directory
            Copy-Item -Path (Join-Path $vcCrtDir.FullName '*.dll') -Destination $patchedDir -Force
            foreach ($requiredCrt in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
              if (-not (Test-Path -LiteralPath (Join-Path $patchedDir $requiredCrt) -PathType Leaf)) {
                throw "Required Visual C++ runtime file was not packaged: $requiredCrt"
              }
            }
            $vcompDll = Get-ChildItem -LiteralPath (Join-Path $vsInstall 'VC\Redist\MSVC') `
              -Filter 'vcomp140.dll' -File -Recurse |
              Where-Object {
                $_.FullName -match '(?i)\\x64\\Microsoft\.VC[^\\]*\.OpenMP\\vcomp140\.dll$' -and
                $_.FullName -notmatch '(?i)\\onecore\\'
              } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $vcompDll) { throw 'The x64 Visual C++ OpenMP runtime DLL was not found.' }
            Copy-Item -LiteralPath $vcompDll.FullName -Destination $patchedDir -Force
            $packagedTbb = Join-Path $patchedDir 'tbb12.dll'
            if (-not (Test-Path -LiteralPath $packagedTbb -PathType Leaf)) {
              $tbbDll = Get-ChildItem -LiteralPath $ovRoot -Filter 'tbb12.dll' -File -Recurse |
                Sort-Object FullName -Descending |
                Select-Object -First 1
              if (-not $tbbDll) { throw 'The OpenVINO x64 tbb12.dll dependency was not found.' }
              Copy-Item -LiteralPath $tbbDll.FullName -Destination $patchedDir -Force
            }
            Get-ChildItem -LiteralPath $patchedDir -File |
              Sort-Object Name |
              ForEach-Object { "$($_.Name)`t$($_.Length)" } |
              Set-Content -LiteralPath (Join-Path $patchedDir 'runtime-files.txt') -Encoding utf8
            $dumpbin = Get-ChildItem -LiteralPath (Join-Path $vsInstall 'VC\Tools\MSVC') `
              -Filter 'dumpbin.exe' -File -Recurse |
              Where-Object { $_.FullName -match '(?i)\\bin\\Hostx64\\x64\\dumpbin\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $dumpbin) { throw 'The x64 dumpbin.exe tool was not found.' }
            $dependencyReport = Join-Path $patchedDir 'runtime-dependencies.txt'
            Set-Content -LiteralPath $dependencyReport -Value "dumpbin: $($dumpbin.FullName)" -Encoding utf8
            $runtimeBinaries = Get-ChildItem -LiteralPath $patchedDir -File |
              Where-Object { $_.Extension -in @('.exe', '.dll') } |
              Sort-Object Name
            foreach ($runtimeBinary in $runtimeBinaries) {
              Add-Content -LiteralPath $dependencyReport -Value "`r`n===== $($runtimeBinary.Name) =====" -Encoding utf8
              $dependencyOutput = & $dumpbin.FullName /dependents $runtimeBinary.FullName 2>&1
              if ($LASTEXITCODE -ne 0) {
                throw "dumpbin failed for $($runtimeBinary.Name) (exit $LASTEXITCODE)."
              }
              Add-Content -LiteralPath $dependencyReport -Value $dependencyOutput -Encoding utf8
            }
            Write-Output "Packaged Visual C++ runtime: $($vcCrtDir.FullName)"
          } catch {
            Write-Error $_
            throw
          } finally {
            Stop-Transcript | Out-Null
          }
          exit 0

      - name: Upload NPU-compatible runtime
        uses: actions/upload-artifact@v4
        with:
          name: npu-compatible-openvino-runtime
          path: .npu-assets/patched-openvino-no-npuw-b10470
          if-no-files-found: error
          retention-days: 3

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npu-runtime-build-diagnostics
          path: .npu-probe
          if-no-files-found: warn
          retention-days: 14

  probe:
    needs: build-runtime
    # Manual only: a public repository must never run pull-request code on a personal PC.
    runs-on: [self-hosted, windows, x64, intel-npu]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1

      - name: Check Intel NPU driver compatibility
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: ./scripts/npu_probe.ps1 -DriverCheckOnly

      - name: Build NPU-compatible OpenVINO llama runtime
        if: ${{ false }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $assetRoot = Join-Path $PWD '.npu-assets'
          $probeRoot = Join-Path $PWD '.npu-probe'
          $srcRoot = Join-Path $assetRoot 'llama-src-b10470'
          $ovRoot = Join-Path $assetRoot 'openvino-toolkit-2026.2.1'
          $buildRoot = Join-Path $assetRoot 'llama-build-no-npuw-b10470'
          $patchedDir = Join-Path $assetRoot 'patched-openvino-no-npuw-b10470'
          New-Item -ItemType Directory -Path $assetRoot, $probeRoot -Force | Out-Null
          Start-Transcript -LiteralPath (Join-Path $probeRoot 'build.log') -Force | Out-Null
          try {
            if ((Test-Path -LiteralPath (Join-Path $patchedDir 'llama-server.exe') -PathType Leaf) -and
                (Test-Path -LiteralPath (Join-Path $patchedDir 'ggml-openvino.dll') -PathType Leaf)) {
              Write-Output "Reusing cached NPU-compatible runtime: $patchedDir"
            } else {
              if (-not (Test-Path -LiteralPath (Join-Path $srcRoot 'CMakeLists.txt') -PathType Leaf)) {
                git clone --depth 1 --branch b10470 https://github.com/ggml-org/llama.cpp.git $srcRoot
                if ($LASTEXITCODE -ne 0) { throw "llama.cpp clone failed (exit $LASTEXITCODE)." }
              }

              $extra = Join-Path $srcRoot 'ggml\src\ggml-openvino\ggml-openvino-extra.cpp'
              $source = Get-Content -LiteralPath $extra -Raw
              $configPattern = New-Object Text.RegularExpressions.Regex(
                '(?s)\s*if \(device_name == "NPU"\) \{.*?\}\s*else if \(cache_dir && strlen\(cache_dir\) > 0\) \{\s*compile_config\.insert\(ov::cache_dir\(cache_dir\)\);\s*compile_config\.insert\(ov::cache_mode\(ov::CacheMode::OPTIMIZE_SIZE\)\);\s*\}'
              )
              $patchedSource = $configPattern.Replace(
                $source,
                "`r`n    if (cache_dir && strlen(cache_dir) > 0) {`r`n        compile_config.insert(ov::cache_dir(cache_dir));`r`n        compile_config.insert(ov::cache_mode(ov::CacheMode::OPTIMIZE_SIZE));`r`n    }",
                1
              )
              if ($patchedSource -eq $source) {
                if ($source -notmatch 'compile_config\.insert\(ov::cache_dir\(cache_dir\)\)') {
                  throw 'Could not remove the private NPUW compile configuration.'
                }
              } else {
                Set-Content -LiteralPath $extra -Value $patchedSource -Encoding utf8
              }
              if ($patchedSource -match 'NPU_COMPILER_DYNAMIC_QUANTIZATION|NPU_USE_NPUW|NPUW_[A-Z_]+') {
                throw 'A private NPUW compile option remains after patching.'
              }

              $ovZip = Join-Path $assetRoot 'openvino-toolkit-windows-2026.2.1.zip'
              $ovUrl = 'https://storage.openvinotoolkit.org/repositories/openvino/packages/2026.2.1/windows/openvino_toolkit_windows_2026.2.1.21919.ede283a88e3_x86_64.zip'
              $validOvZip = $false
              if (Test-Path -LiteralPath $ovZip -PathType Leaf) {
                try {
                  if ((Get-Item -LiteralPath $ovZip).Length -lt 190MB) { throw 'Archive is too small.' }
                  [System.IO.Compression.ZipFile]::OpenRead($ovZip).Dispose()
                  $validOvZip = $true
                } catch { $validOvZip = $false }
              }
              if (-not $validOvZip) {
                Remove-Item -LiteralPath $ovZip -Force -ErrorAction SilentlyContinue
                curl.exe --ipv4 --fail --location --retry 5 --retry-delay 5 --connect-timeout 20 --max-time 1800 --output $ovZip $ovUrl
                if ($LASTEXITCODE -ne 0) { throw "OpenVINO SDK download failed (exit $LASTEXITCODE)." }
                if ((Get-Item -LiteralPath $ovZip).Length -lt 190MB) { throw 'OpenVINO SDK archive is too small.' }
                [System.IO.Compression.ZipFile]::OpenRead($ovZip).Dispose()
              }
              $ovConfig = Get-ChildItem -LiteralPath $ovRoot -Filter 'OpenVINOConfig.cmake' -File -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if (-not $ovConfig) {
                Expand-Archive -LiteralPath $ovZip -DestinationPath $ovRoot -Force
                $ovConfig = Get-ChildItem -LiteralPath $ovRoot -Filter 'OpenVINOConfig.cmake' -File -Recurse |
                  Select-Object -First 1
              }
              if (-not $ovConfig) { throw 'OpenVINOConfig.cmake was not found after SDK extraction.' }
              $ovCmakeDir = Split-Path -Parent $ovConfig.FullName
              $ovPackageRoot = Split-Path -Parent (Split-Path -Parent $ovCmakeDir)

              $vcpkgRoot = Join-Path $assetRoot 'vcpkg'
              if (-not (Test-Path -LiteralPath (Join-Path $vcpkgRoot 'vcpkg.exe') -PathType Leaf)) {
                git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkgRoot
                if ($LASTEXITCODE -ne 0) { throw "vcpkg clone failed (exit $LASTEXITCODE)." }
                & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
                if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed (exit $LASTEXITCODE)." }
              }
              & (Join-Path $vcpkgRoot 'vcpkg.exe') install opencl --triplet x64-windows --disable-metrics
              if ($LASTEXITCODE -ne 0) { throw "vcpkg OpenCL install failed (exit $LASTEXITCODE)." }

              cmake -S $srcRoot -B $buildRoot -G 'Visual Studio 17 2022' -A x64 `
                -DGGML_OPENVINO=ON `
                -DLLAMA_CURL=OFF `
                -DOpenVINO_DIR="$ovCmakeDir" `
                -DCMAKE_TOOLCHAIN_FILE="$vcpkgRoot\scripts\buildsystems\vcpkg.cmake"
              if ($LASTEXITCODE -ne 0) { throw "llama.cpp CMake configure failed (exit $LASTEXITCODE)." }
              cmake --build $buildRoot --config Release --target llama-server --parallel 4
              if ($LASTEXITCODE -ne 0) { throw "llama.cpp build failed (exit $LASTEXITCODE)." }

              $runtimeDir = Join-Path $buildRoot 'bin\Release'
              if (-not (Test-Path -LiteralPath (Join-Path $runtimeDir 'llama-server.exe') -PathType Leaf)) {
                throw 'NPU-compatible llama-server.exe was not built.'
              }
              New-Item -ItemType Directory -Path $patchedDir -Force | Out-Null
              Copy-Item -Path (Join-Path $runtimeDir '*') -Destination $patchedDir -Recurse -Force
              $ovRuntimeBin = Join-Path $ovPackageRoot 'runtime\bin\intel64\Release'
              if (Test-Path -LiteralPath $ovRuntimeBin -PathType Container) {
                Copy-Item -Path (Join-Path $ovRuntimeBin '*') -Destination $patchedDir -Recurse -Force
              }
              $openClDll = Join-Path $vcpkgRoot 'installed\x64-windows\bin\OpenCL.dll'
              if (Test-Path -LiteralPath $openClDll -PathType Leaf) {
                Copy-Item -LiteralPath $openClDll -Destination $patchedDir -Force
              }
              Write-Output "Built NPU-compatible runtime: $patchedDir"
            }
          } catch {
            Write-Error $_
            throw
          } finally {
            Stop-Transcript | Out-Null
          }

      - name: Download NPU-compatible OpenVINO runtime
        if: ${{ inputs.runtime_variant != 'official' }}
        uses: actions/download-artifact@v4
        with:
          name: npu-compatible-openvino-runtime
          path: .npu-assets/patched-openvino-no-npuw-b10470

      - name: Prepare NPU probe assets
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          VOXSUB_NPU_RUNTIME_VARIANT: ${{ inputs.runtime_variant || 'patched' }}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          New-Item -ItemType Directory -Path (Join-Path $PWD '.npu-probe') -Force | Out-Null
          Start-Transcript -LiteralPath (Join-Path $PWD '.npu-probe\prepare.log') -Force | Out-Null
          try {
          $assetRoot = Join-Path $PWD '.npu-assets'
          $probeRoot = Join-Path $PWD '.npu-probe'
          $runtimeRoot = Join-Path $assetRoot 'openvino'
          $runtimeVariant = if ($env:VOXSUB_NPU_RUNTIME_VARIANT -eq 'official') { 'official' } else { 'patched' }
          New-Item -ItemType Directory -Path $runtimeRoot, $probeRoot -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $probeRoot 'probe.log') -Value ''
          Add-Content -LiteralPath (Join-Path $probeRoot 'probe.log') -Value "Requested runtime variant: $runtimeVariant"

          $runtimeZip = Join-Path $assetRoot 'llama-b10470-openvino.zip'
          $runtimeUrl = 'https://github.com/ggml-org/llama.cpp/releases/download/b10470/llama-b10470-bin-win-openvino-2026.2.1-x64.zip'
          $existingServer = Get-ChildItem -LiteralPath $runtimeRoot -Filter 'llama-server.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $validZip = $false
          if (Test-Path -LiteralPath $runtimeZip) {
            try { [System.IO.Compression.ZipFile]::OpenRead($runtimeZip).Dispose(); $validZip = $true } catch { $validZip = $false }
          }
          if (-not $validZip -and ($runtimeVariant -eq 'official' -or -not $existingServer)) {
            for ($attempt = 1; $attempt -le 5 -and -not $validZip; $attempt++) {
              Remove-Item -LiteralPath $runtimeZip -Force -ErrorAction SilentlyContinue
              try {
                Invoke-WebRequest -Uri $runtimeUrl -OutFile $runtimeZip -UseBasicParsing -TimeoutSec 180
                [System.IO.Compression.ZipFile]::OpenRead($runtimeZip).Dispose()
                $validZip = $true
              } catch {
                Write-Warning "Runtime download attempt $attempt failed: $($_.Exception.Message)"
                Start-Sleep -Seconds ([Math]::Min(30, $attempt * 5))
              }
            }
            if (-not $validZip) { throw "llama OpenVINO runtime archive could not be downloaded after 5 attempts." }
          }
          if ($validZip) {
            if ($runtimeVariant -eq 'official' -and (Test-Path -LiteralPath $runtimeRoot)) {
              Remove-Item -LiteralPath $runtimeRoot -Recurse -Force
              New-Item -ItemType Directory -Path $runtimeRoot -Force | Out-Null
            }
            Expand-Archive -LiteralPath $runtimeZip -DestinationPath $runtimeRoot -Force
          } elseif ($existingServer) {
            Add-Content -LiteralPath (Join-Path $probeRoot 'probe.log') -Value "Reusing extracted runtime: $($existingServer.FullName)"
          }
          if ($runtimeVariant -eq 'patched') {
            $patchedRuntime = Join-Path $assetRoot 'patched-openvino-no-npuw-b10470'
            if (-not (Test-Path -LiteralPath (Join-Path $patchedRuntime 'llama-server.exe') -PathType Leaf)) {
              throw 'The NPU-compatible OpenVINO runtime is missing.'
            }
            Copy-Item -Path (Join-Path $patchedRuntime '*') -Destination $runtimeRoot -Recurse -Force
            Add-Content -LiteralPath (Join-Path $probeRoot 'probe.log') -Value "Using source-built NPU-compatible runtime: $patchedRuntime"
            foreach ($diagnosticName in @('runtime-files.txt')) {
              $diagnosticPath = Join-Path $patchedRuntime $diagnosticName
              if (Test-Path -LiteralPath $diagnosticPath -PathType Leaf) {
                Add-Content -LiteralPath (Join-Path $probeRoot 'probe.log') -Value "`r`n===== $diagnosticName ====="
                Add-Content -LiteralPath (Join-Path $probeRoot 'probe.log') -Value (Get-Content -LiteralPath $diagnosticPath -Raw)
              }
            }
            $dependencyReport = Join-Path $patchedRuntime 'runtime-dependencies.txt'
            if (Test-Path -LiteralPath $dependencyReport -PathType Leaf) {
              $dependencyReportSize = (Get-Item -LiteralPath $dependencyReport).Length
              Add-Content -LiteralPath (Join-Path $probeRoot 'probe.log') -Value "runtime-dependencies.txt generated ($dependencyReportSize bytes; retained in runtime artifact)."
            }
          } else {
            Add-Content -LiteralPath (Join-Path $probeRoot 'probe.log') -Value "Using official llama.cpp b10470 OpenVINO 2026.2.1 runtime."
          }

          } catch {
            Write-Error $_
            throw
          } finally {
            Stop-Transcript | Out-Null
          }

      - name: Verify every Model Hub NPU contract
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          VOXSUB_LLAMA_DIR_INPUT: ${{ inputs.llama_dir }}
          VOXSUB_NPU_MODEL_ID: ${{ inputs.model_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonRoot = Join-Path $PWD '.npu-assets\python-3.11.9-embed-amd64'
          $pythonExe = Join-Path $pythonRoot 'python.exe'
          if (-not (Test-Path -LiteralPath $pythonExe -PathType Leaf)) {
            $pythonZip = Join-Path $PWD '.npu-assets\python-3.11.9-embed-amd64.zip'
            $pythonUrl = 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip'
            Remove-Item -LiteralPath $pythonZip -Force -ErrorAction SilentlyContinue
            Invoke-WebRequest -Uri $pythonUrl -OutFile $pythonZip -UseBasicParsing -TimeoutSec 180
            if ((Get-Item -LiteralPath $pythonZip).Length -lt 8MB) {
              throw 'Embedded Python archive is unexpectedly small.'
            }
            New-Item -ItemType Directory -Path $pythonRoot -Force | Out-Null
            Expand-Archive -LiteralPath $pythonZip -DestinationPath $pythonRoot -Force
          }
          $runtimeDir = if ($env:VOXSUB_LLAMA_DIR_INPUT) {
            $env:VOXSUB_LLAMA_DIR_INPUT
          } else {
            Join-Path $PWD '.npu-assets\openvino'
          }
          # Keep the 23 GB model matrix outside the checkout. actions/checkout
          # cleans untracked files in the repository at the start of each run.
          $modelsDir = Join-Path $env:RUNNER_WORKSPACE '.voxsub-npu-cache\catalog-models'
          $probeArgs = @(
            './scripts/npu_catalog_probe.py',
            '--runtime-dir', $runtimeDir,
            '--models-dir', $modelsDir,
            '--output-dir', (Join-Path $PWD '.npu-probe')
          )
          if ($env:LOCALAPPDATA) {
            $installedModelsDir = Join-Path $env:LOCALAPPDATA 'VoxSub\models'
            if (Test-Path -LiteralPath $installedModelsDir -PathType Container) {
              Write-Output "Reusing installed VoxSub models from $installedModelsDir"
              $probeArgs += @('--reuse-models-dir', $installedModelsDir)
            }
          }
          if ($env:VOXSUB_NPU_MODEL_ID -and $env:VOXSUB_NPU_MODEL_ID -ne 'all') {
            $probeArgs += @('--model-id', $env:VOXSUB_NPU_MODEL_ID)
          }
          & $pythonExe @probeArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Model Hub NPU matrix failed (exit $LASTEXITCODE)."
          }

      - name: Print probe summary
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $summaryPath = '.npu-probe\catalog-summary.json'
          $markdownPath = '.npu-probe\catalog-summary.md'
          if (Test-Path -LiteralPath $markdownPath) {
            Get-Content -LiteralPath $markdownPath -Encoding UTF8
          }
          if (Test-Path -LiteralPath $summaryPath) {
            $summary = Get-Content -LiteralPath $summaryPath -Raw -Encoding UTF8
            $summary
            $result = $summary | ConvertFrom-Json
            $annotation = ($result.models | ForEach-Object {
              "$($_.model_id)=$($_.status)/$($_.reason_code)"
            }) -join '; '
            if ($result.result -eq 'PASS') {
              Write-Output "::notice file=.npu-probe/catalog-summary.json,line=1,title=NPU model matrix passed::$annotation"
            } else {
              Write-Output "::error file=.npu-probe/catalog-summary.json,line=1,title=NPU model matrix failed::$annotation"
            }
          } else {
            Write-Output 'No NPU model matrix summary was created.'
          }

      - name: Upload probe diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: intel-npu-probe
          path: .npu-probe
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
